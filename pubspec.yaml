publish_to: none

name: flutter_gherkin
description: A Gherkin / Cucumber parser and test runner for Dart and Flutter
version: 2.0.0
homepage: https://github.com/jonsamwell/flutter_gherkin

environment:
    sdk: ">=3.0.0 <4.0.0"
    flutter: ">=3.0.0"

dependencies:
    flutter:
        sdk: flutter
    flutter_test:
        sdk: flutter
    flutter_driver:
        sdk: flutter
    meta:
    # gherkin: ^2.0.2
    gherkin:
        path: ../dart_gherkin

dev_dependencies:
    test:
    pedantic:
